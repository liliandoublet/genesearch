[project]
name = "doudoumil-search"
version = "0.1.0"
description = "Moteur de recherche généalogique personnel sur notices d'archives françaises"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
doudoumil = "doudoumil_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doudoumil_search"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 signalent à tort les caractères typographiques du français (’, « », etc.).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["navigateur: parcours dans Chromium (sautés sans navigateur)"]
# Un test bloqué échoue avec la pile des appels au lieu de pendre indéfiniment.
faulthandler_timeout = 60

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
